#!/usr/bin/nft -f

flush ruleset

table inet examarch {
    set allow4 {
        type ipv4_addr
    }

    set static4 {
        type ipv4_addr
        flags interval
    }

    chain input {
        type filter hook input priority filter; policy drop;
        iif "lo" accept
        ct state established,related accept
        ct state invalid drop
        udp sport 67 udp dport 68 accept
        icmp type { destination-unreachable, time-exceeded } accept
        limit rate 5/second log prefix "EXAMARCH-IN " level info
    }

    chain forward {
        type filter hook forward priority filter; policy drop;
    }

    chain output {
        type filter hook output priority filter; policy drop;
        oif "lo" accept
        ct state established,related accept
        ct state invalid drop

        udp sport 68 udp dport 67 accept
        meta skuid "systemd-resolve" meta l4proto { tcp, udp } th dport 53 accept
        meta skuid "systemd-timesync" udp dport 123 accept

        ip daddr @allow4 tcp dport { 80, 443 } accept
        ip daddr @allow4 meta l4proto udp accept
        ip daddr @static4 accept

        limit rate 20/second log prefix "EXAMARCH-OUT " level info
    }
}
